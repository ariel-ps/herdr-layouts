id = "dev.ariel.herdr-layouts"
name = "Layouts"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Save and restore layouts and create agent grids."
platforms = ["macos", "linux"]

[[build]]
command = ["sh", "./scripts/build/install.sh"]

[[events]]
on = "tab.created"
command = ["./libexec/herdr-named-tab"]

[[events]]
on = "tab.renamed"
command = ["./libexec/herdr-named-tab"]

[[actions]]
id = "list"
title = "List saved layouts"
command = ["zsh","-c","source ./shell.zsh && herdr-layout-list"]

[[actions]]
id = "control-panel"
title = "Control panel"
description = "Browse tools, plugins, sound settings, and the quick guide."
contexts = ["global", "workspace", "tab", "pane"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin action invoke cloudmanic.herdr-plus.quick-actions"]
